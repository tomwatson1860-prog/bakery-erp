<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bakery Project ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2F4F7;--surface:#FFFFFF;--ink:#122033;--ink-2:#44536A;--muted:#6B788D;--line:#C3CCD8;--accent:#1D5BA3;--accent-2:#164C8A;--accent-soft:#E1EAF6;--rail:#122A45;--crit:#A22A2A;--crit-soft:#F8E0E0}
@media (prefers-color-scheme:dark){:root{--bg:#0D131B;--surface:#141C26;--ink:#E6ECF3;--ink-2:#AAB6C5;--muted:#8290A3;--line:#344354;--accent:#5B9BE6;--accent-2:#7AAEEB;--accent-soft:#16283D;--rail:#0A1726;--crit:#F28E8E;--crit-soft:#3B1A1D}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
body{display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px 22px;box-shadow:0 12px 40px rgb(0 0 0 / .08)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--rail);display:grid;place-items:center;color:#E3B23C;font:700 17px/1 "Bricolage Grotesque",system-ui,sans-serif}
h1{font:700 22px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input[type=password]{width:100%;font:600 22px/1 "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.3em;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13.5px;color:var(--ink-2)}
button{width:100%;font:600 15px/1 "IBM Plex Sans",system-ui,sans-serif;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:hover{background:var(--accent-2)} button:disabled{opacity:.6;cursor:progress}
.err{display:none;margin-top:12px;padding:9px 12px;border-radius:6px;background:var(--crit-soft);color:var(--crit);font-size:13.5px}
.err.on{display:block}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="off">
  <div class="brand"><div class="mark" aria-hidden="true">B</div><h1>Bakery Project ERP</h1></div>
  <p>Enter the access code to open the ERP.</p>
  <label for="code">Access code</label>
  <input id="code" type="password" inputmode="numeric" autocomplete="off" required autofocus>
  <label class="row"><input type="checkbox" id="keep"> Remember on this device</label>
  <button type="submit" id="go">Open</button>
  <div class="err" id="err" role="alert"></div>
  <noscript><div class="err on">This page needs JavaScript turned on.</div></noscript>
</form>

const KEY = "bakery-erp-access";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const form = document.getElementById("gate"), err = document.getElementById("err"), go = document.getElementById("go");
form.addEventListener("submit", async e => {
  e.preventDefault(); err.className = "err"; go.disabled = true; go.textContent = "Opening…";
  const code = document.getElementById("code").value.trim();
  try {
    const html = await open(code);
    try { sessionStorage.setItem(KEY, code); if (document.getElementById("keep").checked) localStorage.setItem(KEY, code); } catch (_) {}
    show(html);
  } catch (_) {
    err.textContent = window.crypto && crypto.subtle ? "That code isn't right. Try again." : "This browser can't open the ERP. Use a current version of Chrome, Safari, Edge or Firefox.";
    err.className = "err on"; go.disabled = false; go.textContent = "Open";
    const f = document.getElementById("code"); f.select(); f.focus();
  }
});
(async () => {
  let saved = null; try { saved = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (_) {}
  if (!saved) return;
  go.disabled = true; go.textContent = "Opening…";
  try { show(await open(saved)); } catch (_) { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} go.disabled = false; go.textContent = "Open"; }
})();
</script>
